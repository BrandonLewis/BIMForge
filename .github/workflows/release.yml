name: Release

on:
  push:
    tags: ["v*"]
  # Release the version committed in pyproject.toml from the chosen branch; the
  # run creates and pushes the matching tag itself. (A tag pushed from a
  # restricted environment may be refused at the transport; this path needs
  # only the Actions API.) Events created with GITHUB_TOKEN do not start new
  # workflow runs, so the tag this run pushes does not trigger a second run.
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing (no API token stored anywhere)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version (tag == pyproject version; dispatch takes pyproject's)
        id: ver
        run: |
          python - <<'PY'
          import os, subprocess, sys, tomllib
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if os.environ["GITHUB_EVENT_NAME"] == "push":
              tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
              if tag != ver:
                  sys.exit(f"tag {tag} != pyproject version {ver}")
          else:
              # dispatch: refuse to re-release a version that already has a tag
              refs = subprocess.run(["git", "ls-remote", "--tags", "origin", f"v{ver}"],
                                    capture_output=True, text=True, check=True).stdout
              if refs.strip():
                  sys.exit(f"v{ver} already exists on origin; bump pyproject.toml first")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\n")
          print(f"releasing v{ver}")
          PY
      - name: Test gate
        run: |
          pip install -e '.[all,terrain]' pytest
          python -m pytest bimforge -q
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build --outdir dist .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag the released commit (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.ver.outputs.version }}" -m "bimforge ${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ steps.ver.outputs.version }}" dist/* --title "v${{ steps.ver.outputs.version }}" --generate-notes
