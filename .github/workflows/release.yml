name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write   # PyPI trusted publishing (no API token stored anywhere)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version gate (tag == pyproject version)
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          sys.exit(0 if tag == ver else f"tag {tag} != pyproject version {ver}")
          PY
      - name: Test gate
        run: |
          pip install -e '.[all]' pytest
          python -m pytest bimforge -q
      - name: Build sdist + wheel
        run: |
          pip install build
          python -m build --outdir dist .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
