name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # upgrade the runner's preinstalled pip/setuptools first: pip-audit below
        # audits the whole environment, and a stale tool-cache setuptools is not
        # a bimforge dependency
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e '.[all,terrain,ids]' pytest
      - name: Standalone — the estimating layer must not be present
        # bimforge imports nothing from estimating_tools; the suite proves it
        # by running where that package cannot be imported at all.
        run: |
          python - <<'PY'
          import importlib.util, sys
          if importlib.util.find_spec("estimating_tools"):
              sys.exit("estimating_tools is installed; bimforge must test standalone")
          print("standalone ok")
          PY
      - run: python -m pytest bimforge tests -q
      - name: Dependency vulnerability audit (pip-audit)
        # newest leg only: a fix can need a newer Python than the floor, and an
        # unfixable floor resolve is not ours to fix
        if: matrix.python-version == '3.13'
        run: |
          pip install pip-audit
          pip-audit --skip-editable

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks walks the history
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Provenance scan (bid numbers, machine paths, credentials)
        # scripts/deorg_scan.py. The maintainer adds project-specific tokens
        # through the DEORG_EXTRA_PATTERNS repository secret so the list itself
        # never lands in the tree.
        env:
          DEORG_EXTRA_PATTERNS: ${{ secrets.DEORG_EXTRA_PATTERNS }}
        run: python scripts/deorg_scan.py
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL -o gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
      - name: Wheel smoke (build, install clean, import, CLIs)
        run: |
          pip install build
          python -m build --wheel --outdir dist .
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q "$(ls dist/bimforge-*.whl)[all]"
          /tmp/smoke/bin/python - <<'PY'
          import importlib
          for m in ("bimforge", "bimforge.bim.cli", "bimforge.bim.schedule_io", "bimforge.bim.xer",
                    "bimforge.bim.cost5d", "bimforge.cad.stylepack", "bimforge.author", "bimforge.sheets.cli"):
              importlib.import_module(m)
          print("wheel imports ok")
          PY
          /tmp/smoke/bin/est-bim --help >/dev/null
          /tmp/smoke/bin/est-sheets --help >/dev/null
          echo "CLIs ok"

  bsi-rules:
    # buildingSMART's normative rules (implementer agreements, informal
    # propositions, industry practice) on every kind of IFC bimforge writes,
    # gated by scripts/bsi_baseline.yaml (#94). The rules are a behave suite
    # with their own pins, so they get their own venv; the commit is pinned
    # in bimforge/bim/contract/bsi_rules.yaml (which ships, so est-bim
    # validate names it too) so a new rule lands as a deliberate bump, not a
    # red main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The pinned rule set (bimforge/bim/contract/bsi_rules.yaml)
        id: pin
        run: |
          # flat `key: value` lines, read without PyYAML (the runner's
          # system Python, before setup-python, may not have it)
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          pin = {}
          for line in open("bimforge/bim/contract/bsi_rules.yaml"):
              key, sep, value = line.split("#")[0].partition(":")
              if sep:
                  pin[key.strip()] = value.strip()
          print(f"repository={pin['repository']}")
          print(f"ref={pin['ref']}")
          EOF
      - uses: actions/checkout@v5
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: ifc-gherkin-rules
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            ifc-gherkin-rules/requirements.txt
      - name: Install bimforge, and the rules in their own venv
        run: |
          python -m pip install -U pip
          # ids and terrain: the conformance suite holds every file to
          # est-bim validate's checks (ifctester) and builds the terrain
          # variant; without them it skips and writes nothing to check
          pip install -e '.[all,terrain,ids]' pytest
          python -m venv /tmp/rules
          /tmp/rules/bin/pip install -q -r ifc-gherkin-rules/requirements.txt \
            django ifcopenshell==0.8.5
      - name: Write every writer's output
        env:
          BIMFORGE_CONFORMANCE_OUT: ${{ runner.temp }}/conformance
        run: python -m pytest bimforge/bim/tests/test_conformance.py -q
      - name: The inventory of what each command writes is current (C.9)
        # a new entity type, set or property fails until docs/ifc-inventory.*
        # is regenerated (scripts/ifc_inventory.py DIR) and seen in review
        run: python scripts/ifc_inventory.py ${{ runner.temp }}/conformance --check
      - name: Normative rules against the baseline
        run: >
          python scripts/bsi_rules.py --rules ifc-gherkin-rules
          --python /tmp/rules/bin/python ${{ runner.temp }}/conformance
      - name: Keep the checked files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-ifc
          path: ${{ runner.temp }}/conformance
