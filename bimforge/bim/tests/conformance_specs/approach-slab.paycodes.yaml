# Conformance paycodes for approach-slab.spec.yaml.
# Fixture values from the family's own tests; not a project or a bid.
rules:
- {match: '(?i)approach (slab reinforcing|dowels)', group: as_steel}
- {match: '(?i)approach slab type_', group: as_concrete}
groups:
  as_concrete: {measure: GrossVolume}
  as_steel: {measure: Weight}
codes:
  AS-CONC: {group: as_concrete, measure: GrossVolume, unit: CY, item_number: '0001', description: 'Structural
      concrete, approach slab'}
  AS-STEEL: {group: as_steel, measure: Weight, unit: LB, item_number: '0002', description: 'Bar
      reinforcing steel, approach slab', elements_carry_weight: true}
