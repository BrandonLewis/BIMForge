# Conformance paycodes for pipe-supports.spec.yaml.
# Fixture values from the family's own tests; not a project or a bid.
rules:
- {match: '(?i)footing rebar', group: ps_steel}
- {match: '(?i)pipe support footing$', group: ps_concrete}
groups:
  ps_concrete: {measure: GrossVolume}
  ps_steel: {measure: Weight}
codes:
  PS-CONC: {group: ps_concrete, measure: GrossVolume, unit: CY, item_number: '0001', description: 'Structural
      concrete, pipe support footings'}
  PS-STEEL: {group: ps_steel, measure: Weight, unit: LB, item_number: '0002', description: 'Bar
      reinforcing steel, pipe support footings', elements_carry_weight: true}
