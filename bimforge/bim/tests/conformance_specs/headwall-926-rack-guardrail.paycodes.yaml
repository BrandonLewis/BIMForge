# Conformance paycodes for headwall-926-rack-guardrail.spec.yaml.
# Fixture values from the family's own tests; not a project or a bid.
rules:
- {match: '(?i)guardrail', group: hw_rail}
- {match: '(?i)trash rack', group: hw_rack}
- {match: '(?i)headwall|wingwall|cutoff|footing', group: hw_concrete}
groups:
  hw_concrete: {measure: GrossVolume}
  hw_rack: {measure: Weight}
  hw_rail: {measure: Length}
codes:
  HW-CONC: {group: hw_concrete, measure: GrossVolume, unit: CY, item_number: '0001', description: 'Structural
      concrete, 926 headwall'}
  HW-RACK: {group: hw_rack, measure: Weight, unit: LB, item_number: '0003', description: 'Trash
      rack, flat bars', elements_carry_weight: true}
  HW-RAIL: {group: hw_rail, measure: Length, unit: LF, item_number: '0004', description: Pipe
      guardrail}
