# Caltrans box-culvert structural concrete (CY) + bar reinforcing steel (LB).
rules:
  - match: "(?i)box culvert barrel"
    group: bc_concrete
  - match: "(?i)box culvert reinforcing"
    group: bc_steel
groups:
  bc_concrete: {measure: GrossVolume}
  bc_steel: {measure: Weight}
codes:
  STRUCT-CONC-BC:
    group: bc_concrete
    measure: GrossVolume
    unit: CY
    item_number: "510060"
    description: "Structural concrete, box culvert"
  BAR-STEEL-BC:
    group: bc_steel
    measure: Weight
    unit: LB
    item_number: "520102"
    description: "Bar reinforcing steel (box culvert)"
    elements_carry_weight: true
