# Caltrans B11-51 tubular handrailing: LF pay + supporting steel/mortar/rebar.
# Steel weight is emergent from hollow volume x 490 pcf (see rail_section note).
rules:
  - match: "(?i)top rail"                                  # payment rail: LF + steel
    group: hr_pay
  - match: "(?i)(lower rail|post \\d|splice sleeve|rail cap|end return)"
    group: hr_steel
  - match: "(?i)dowel"
    group: hr_rebar
  - match: "(?i)mortar"
    group: hr_mortar
groups:
  hr_pay:    {measure: GrossVolume, density_pcf: 490}
  hr_steel:  {measure: GrossVolume, density_pcf: 490}
  hr_rebar:  {measure: GrossWeight}
  hr_mortar: {measure: GrossVolume}
# TUBULAR-HANDRAIL (LF) is the only BID PAY ITEM. The HANDRAIL-STL / -STL-TOP /
# -REBAR / -MORTAR codes are supporting QTO/BBS tracking quantities (steel LBS,
# dowel LBS, mortar CF), incidental to the LF unit price -- NOT separate bid
# items, so they intentionally carry no item_number.
codes:
  TUBULAR-HANDRAIL:
    group: hr_pay
    measure: Length
    unit: LF
    item_number: "833601"
    description: "Tubular handrailing (B11-51)"
  HANDRAIL-STL-TOP:
    group: hr_pay
    measure: GrossWeight
    unit: LBS
    description: "Tubular handrailing steel -- top rail"
  HANDRAIL-STL:
    group: hr_steel
    measure: GrossWeight
    unit: LBS
    description: "Tubular handrailing steel"
  HANDRAIL-REBAR:
    group: hr_rebar
    measure: GrossWeight
    unit: LBS
    elements_carry_weight: true   # dowels are weight-only (explicit weight_lb, no volume)
    description: "Handrail post-pocket dowels"
  HANDRAIL-MORTAR:
    group: hr_mortar
    measure: GrossVolume
    unit: CF
    description: "Handrail post-pocket mortar"
