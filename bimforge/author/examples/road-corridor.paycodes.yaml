# Road corridor: pavement courses and earthwork (CY), guardrail and path rail (LF).
rules:
  - match: "(?i)^PATH-HMA "
    group: rc_path_hma
  - match: "(?i)^PATH-AB "
    group: rc_path_ab
  - match: "(?i)^Path rail "
    group: rc_path_rail
  - match: "(?i)^HMA "
    group: rc_hma
  - match: "(?i)^AB "
    group: rc_ab
  - match: "(?i)^Cut "
    group: rc_cut
  - match: "(?i)^Fill "
    group: rc_fill
  - match: "(?i)^Guardrail "
    group: rc_mgs
groups:
  rc_hma: {measure: GrossVolume}
  rc_ab: {measure: GrossVolume}
  rc_cut: {measure: GrossVolume}
  rc_fill: {measure: GrossVolume}
  rc_mgs: {measure: Length}
  rc_path_hma: {measure: GrossVolume}
  rc_path_ab: {measure: GrossVolume}
  rc_path_rail: {measure: Length}
codes:
  PAVE-HMA:
    group: rc_hma
    measure: GrossVolume
    unit: CY
    item_number: "390132"
    description: "Hot mix asphalt"
  PAVE-AB:
    group: rc_ab
    measure: GrossVolume
    unit: CY
    item_number: "260203"
    description: "Class 2 aggregate base"
  EARTH-CUT:
    group: rc_cut
    measure: GrossVolume
    unit: CY
    item_number: "190101"
    description: "Roadway excavation"
  EARTH-FILL:
    group: rc_fill
    measure: GrossVolume
    unit: CY
    item_number: "198010"
    description: "Imported borrow"
  RAIL-MGS:
    group: rc_mgs
    measure: Length
    unit: LF
    description: "Midwest guardrail system (steel post)"
  PATH-HMA:
    group: rc_path_hma
    measure: GrossVolume
    unit: CY
    description: "Hot mix asphalt (shared-use path)"
  PATH-AB:
    group: rc_path_ab
    measure: GrossVolume
    unit: CY
    description: "Class 2 aggregate base (shared-use path)"
  RAIL-PATH:
    group: rc_path_rail
    measure: Length
    unit: LF
    description: "Path rail on a wall (42 in)"
